<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="塩野英語">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>塩野英語練習</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;background:#111827;color:#f9fafb;min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-size:14px;color:#9ca3af}
select{background:#1f2937;color:#f9fafb;border:1px solid #374151;border-radius:8px;padding:6px 8px}
.stat b{color:#34d399}
.card{flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;text-align:center;padding:12px 4px}
.tag{font-size:12px;color:#9ca3af}
.q{font-size:24px;line-height:1.5;font-weight:600}
.a{font-size:26px;line-height:1.5;color:#fbbf24;font-weight:600;min-height:3em}
button{font-size:18px;border:0;border-radius:14px;padding:16px;font-weight:600;color:#fff;cursor:pointer}
.row{display:flex;gap:10px;margin:8px 0}
.row button{flex:1}
.show{background:#2563eb;width:100%}
.ok{background:#059669}.ng{background:#dc2626}.sp{background:#374151}
.hide{display:none}
.mic{background:#7c3aed;width:100%;margin-bottom:8px}
.mic.rec{background:#dc2626}
.heard{font-size:16px;line-height:1.5;color:#a5b4fc;min-height:1.5em;text-align:center;margin-bottom:6px}
.score{font-size:14px;color:#9ca3af}
footer{text-align:center;color:#6b7280;font-size:12px;padding:10px 0}
#lm{position:fixed;inset:0;background:#111827;z-index:10;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
#lm.hide{display:none}
#lm .card{flex:1}
#lm .lj{font-size:24px;color:#9ca3af;line-height:1.5}
#lm .le{font-size:30px;font-weight:700;line-height:1.4;color:#fbbf24}
#lm .lc{font-size:14px;color:#34d399;min-height:1.4em}
#lmplay{width:100%;padding:26px;font-size:24px;background:#059669;margin:8px 0}
#lmplay.on{background:#dc2626}
#lm .opts{display:flex;gap:10px;align-items:center;color:#9ca3af;font-size:14px;margin:6px 0;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <div class="stat">今日 <b id="done">0</b> / 残り <b id="left">0</b></div>
  <select id="cat"></select>
  <select id="dir"><option value="ja">日→英</option><option value="en">英→日</option></select>
  <button class="sp" id="lmopen" style="font-size:14px;padding:6px 10px;border-radius:8px">🎧 聞き流し</button>
</header>
<div id="lm" class="hide">
  <div class="opts"><button class="sp" id="lmclose" style="font-size:14px;padding:8px 12px;border-radius:8px">← 戻る</button>
    <span id="lmcat"></span>
    <label>速度 <select id="lmrate"><option value=".8">ゆっくり</option><option value=".95" selected>ふつう</option><option value="1.1">はやい</option></select></label>
    <label><input type="checkbox" id="lmshuf"> シャッフル(読み上げ時のみ)</label></div>
  <div class="card"><div class="lc" id="lmcnt"></div><div class="lj" id="lmja"></div><div class="le" id="lmen"></div></div>
  <button id="lmplay">▶ 再生（止めるまで流れ続けます）</button>
  <div class="opts" id="lmnote">日本語1回 → 英語3回 を繰り返します。音声ファイル再生なので、画面ロック・他アプリ使用中も流れます。</div>
</div>
<div class="card">
  <div class="tag" id="tag"></div>
  <div class="q" id="q"></div>
  <div class="a" id="a"></div>
</div>
<div class="heard" id="heard"></div>
<input id="typed" placeholder="英語で入力 / 🎤で音声入力" autocapitalize="off" autocomplete="off" style="width:100%;font-size:18px;padding:14px;border-radius:12px;border:1px solid #374151;background:#1f2937;color:#f9fafb;margin-bottom:8px">
<div class="row" id="ansrow"><button class="mic" id="mic" style="margin:0">🎤 音声</button><button class="mic" id="check" style="margin:0;background:#2563eb">✅ 答え合わせ</button></div>
<button class="show" id="show">答えを見る</button>
<div id="judge" class="hide">
  <div class="row"><button class="sp" id="speak">🔊 正解を聞く</button><button class="sp" id="slow">🐢 ゆっくり</button></div>
  <div class="row"><button class="ng" id="ng">もう一度</button><button class="ok" id="ok">覚えた</button></div>
</div>
<footer>覚えたカードは間隔を空けて再出題されます(1→3→7→14→30日)</footer>
<script src="cards.js"></script>
<script>
const KEY="shionoEnglishSRS_v1",INTERVALS=[0,1,3,7,14,30];
const day=()=>Math.floor(Date.now()/864e5);
let state=JSON.parse(localStorage.getItem(KEY)||"{}");
let log=JSON.parse(localStorage.getItem(KEY+"_log")||"{}");
const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(KEY+"_log",JSON.stringify(log))};
const cats=["すべて",...new Set(CARDS.map(c=>c[0]))];
const catSel=document.getElementById("cat");
cats.forEach(c=>catSel.add(new Option(c,c)));
const $=id=>document.getElementById(id);
let queue=[],cur=null;
function build(){
  const c=catSel.value,t=day();
  queue=CARDS.map((x,i)=>i).filter(i=>(c==="すべて"||CARDS[i][0]===c)&&(!state[i]||state[i].due<=t));
  queue.sort((a,b)=>(state[a]?1:0)-(state[b]?1:0)||Math.random()-.5);
  next();
}
function next(){
  if(recOn){recOn=false;rec&&rec.abort()}
  $("done").textContent=log[day()]||0;
  $("left").textContent=queue.length;
  $("judge").classList.add("hide");$("show").classList.remove("hide");
  $("ansrow").classList.remove("hide");$("typed").classList.remove("hide");$("typed").value="";
  $("mic").textContent="🎤 音声";$("heard").textContent="";
  $("a").textContent="";
  if(!queue.length){cur=null;$("tag").textContent="";$("q").textContent="今日の復習は完了";return}
  cur=queue[0];const c=CARDS[cur];
  $("tag").textContent=c[0];
  $("q").textContent=$("dir").value==="ja"?c[2]:c[1];
}
$("show").onclick=()=>{reveal();speak(.9)};
function speak(rate){
  if(cur===null||!window.speechSynthesis)return;
  const u=new SpeechSynthesisUtterance(CARDS[cur][1]);u.lang="en-US";u.rate=typeof rate==="number"?rate:.9;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
$("speak").onclick=()=>speak(.9);
$("slow").onclick=()=>speak(.6);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
const words=t=>t.toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);
function similarity(a,b){
  const A=words(a),B=words(b);if(!B.length)return 0;
  const pool=[...A];let hit=0;
  B.forEach(w=>{const i=pool.indexOf(w);if(i>=0){hit++;pool.splice(i,1)}});
  return Math.round(hit/B.length*100);
}
function reveal(){
  if(cur===null)return;const c=CARDS[cur];
  $("a").textContent=$("dir").value==="ja"?c[1]:c[2];
  $("show").classList.add("hide");$("ansrow").classList.add("hide");$("typed").classList.add("hide");$("judge").classList.remove("hide");
}
function judgeText(text){
  if(cur===null)return;const c=CARDS[cur];
  if(recOn){recOn=false;rec&&rec.stop()}
  if(text&&$("dir").value==="ja"){
    $("heard").innerHTML="あなた: "+text+' <span class="score">(一致 '+similarity(text,c[1])+'%)</span>';
  }
  reveal();speak(.9);
}
if(!SR)$("mic").classList.add("hide");
$("check").onclick=()=>judgeText($("typed").value.trim());
$("typed").addEventListener("keydown",e=>{if(e.key==="Enter")judgeText($("typed").value.trim())});
$("mic").onclick=()=>{
  if(cur===null||!SR)return;
  if(recOn){recOn=false;rec&&rec.stop();return}
  speechSynthesis&&speechSynthesis.cancel();
  recOn=true;committed=$("typed").value.trim();
  $("mic").classList.add("rec");$("mic").textContent="⏹ 停止";$("heard").textContent="聞き取り中…（終わったら停止を押す）";
  startRec();
};
let recOn=false,committed="";
function finishRec(){
  recOn=false;rec=null;$("mic").classList.remove("rec");$("mic").textContent="🎤 音声";
  if($("heard").textContent.startsWith("聞き取り中"))$("heard").textContent="";
  if($("typed").value.trim())$("heard").textContent="直して「答え合わせ」を押す";
}
function startRec(){
  rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.continuous=true;rec.maxAlternatives=1;
  rec.onresult=e=>{
    const t=[...e.results].map(r=>r[0].transcript).join(" ").trim();
    $("typed").value=(committed+" "+t).trim();
  };
  rec.onerror=e=>{
    if(e.error==="no-speech"||e.error==="aborted")return;
    $("heard").textContent="マイクが使えません ("+e.error+")。設定でマイクを許可してください";
    recOn=false;
  };
  rec.onend=()=>{
    if(recOn){
      committed=$("typed").value.trim();
      try{startRec();return}catch(_){}
    }
    finishRec();
  };
  try{rec.start()}catch(_){finishRec()}
}
function grade(ok){
  const s=state[cur]||{lv:0};
  s.lv=ok?Math.min(s.lv+1,5):0;
  s.due=day()+INTERVALS[s.lv];
  state[cur]=s;log[day()]=(log[day()]||0)+1;save();
  queue.shift();
  if(!ok)queue.splice(Math.min(3,queue.length),0,cur);
  next();
}
$("ok").onclick=()=>grade(true);
$("ng").onclick=()=>grade(false);
catSel.onchange=build;$("dir").onchange=next;
build();

// ---- 聞き流しモード: 日本語1回 → 英語3回 を止めるまで無限ループ ----
let lmOn=false,lmRun=0,wake=null,lmSilent=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function say(text,lang,rate,run){
  return new Promise(res=>{
    if(!window.speechSynthesis||run!==lmRun)return res();
    const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;
    const t=setTimeout(res,20000);
    u.onend=u.onerror=()=>{clearTimeout(t);res()};
    speechSynthesis.speak(u);
  });
}
function lmList(){
  const c=catSel.value;
  const l=CARDS.filter(x=>c==="すべて"||x[0]===c);
  if($("lmshuf").checked)l.sort(()=>Math.random()-.5);
  return l;
}
let PL=null,lmAudio=new Audio();lmAudio.loop=true;
fetch("audio/playlists.json").then(r=>r.ok?r.json():null).then(j=>{if(j)PL=j}).catch(()=>{});
function lmShow(i,n){const c=CARDS[i];$("lmcnt").textContent=(n)+" / "+lmTotal;$("lmja").textContent=c[2];$("lmen").textContent=c[1]}
let lmTotal=0;
lmAudio.ontimeupdate=()=>{
  const m=lmPl;if(!m)return;let k=0;
  while(k+1<m.starts.length&&m.starts[k+1]<=lmAudio.currentTime)k++;
  lmTotal=m.cards.length;lmShow(m.cards[k],k+1);
};
let lmPl=null;
async function lmLoop(run){
  const rate=parseFloat($("lmrate").value);
  while(run===lmRun){
    const list=lmList();
    for(let i=0;i<list.length&&run===lmRun;i++){
      const [,en,ja]=list[i];
      $("lmcnt").textContent=(i+1)+" / "+list.length;
      $("lmja").textContent=ja;$("lmen").textContent="";
      await say(ja,"ja-JP",rate,run);await sleep(500);
      for(let k=1;k<=3&&run===lmRun;k++){
        $("lmen").textContent=en;
        await say(en,"en-US",rate,run);await sleep(700);
      }
      await sleep(600);
    }
  }
}
async function lmStart(){
  lmOn=true;lmRun++;
  $("lmplay").textContent="■ 停止";$("lmplay").classList.add("on");
  speechSynthesis.cancel();
  try{if(navigator.wakeLock)wake=await navigator.wakeLock.request("screen")}catch(_){}
  lmPl=PL&&PL[catSel.value];
  if("mediaSession"in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:"英語 聞き流し",artist:"塩野英語"});
    navigator.mediaSession.playbackState="playing";
    navigator.mediaSession.setActionHandler("play",()=>lmAudio.play());
    navigator.mediaSession.setActionHandler("pause",lmStop);
    navigator.mediaSession.setActionHandler("stop",lmStop);
  }
  if(lmPl){
    lmAudio.src="audio/"+lmPl.file;
    lmAudio.play().catch(()=>{lmPl=null;lmLoop(lmRun)});
    return;
  }
  if(!lmSilent){lmSilent=new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");lmSilent.loop=true}
  lmSilent.play().catch(()=>{});
  lmLoop(lmRun);
}
function lmStop(){
  lmOn=false;lmRun++;speechSynthesis.cancel();lmAudio.pause();
  $("lmplay").textContent="▶ 再生（止めるまで流れ続けます）";$("lmplay").classList.remove("on");
  lmSilent&&lmSilent.pause();
  if(wake){wake.release().catch(()=>{});wake=null}
  if("mediaSession"in navigator)navigator.mediaSession.playbackState="none";
}
document.addEventListener("visibilitychange",async()=>{
  if(lmOn&&document.visibilityState==="visible"&&navigator.wakeLock&&!wake){try{wake=await navigator.wakeLock.request("screen")}catch(_){}}
});
$("lmplay").onclick=()=>lmOn?lmStop():lmStart();
$("lmopen").onclick=()=>{speechSynthesis.cancel();$("lmcat").textContent=catSel.value;$("lm").classList.remove("hide")};
$("lmclose").onclick=()=>{lmStop();$("lm").classList.add("hide")};
</script>
</body>
</html>
